# RUN-202: first production deployment keeps public AI disabled.
name = "dj-velar-private-lab"
main = "dj-velar-owner-lab.js"
compatibility_date = "2026-11-17"
workers_dev = true
keep_vars = true

[vars]
PUBLIC_AI_ENABLED = "false"
PUBLIC_AI_DAILY_LIMIT = "20"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[ai]
binding = "AI"

[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "19801"
  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "PUBLIC_GLOBAL_RATE_LIMITER"
namespace_id = "19802"
  [ratelimits.simple]
  limit = 10
  period = 60

[[durable_objects.bindings]]
name = "PUBLIC_AI_BUDGET"
class_name = "VelarAiBudget"

[[migrations]]
tag = "run202-production-budget-v1"
new_sqlite_classes = ["VelarAiBudget"]
