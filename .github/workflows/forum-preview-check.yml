name: Test Constellations forum preview
on:
  push:
    branches: [feature/velardream-constellations-forum]
  pull_request:
    paths: ['forum/**', '.github/workflows/forum-preview-check.yml', 'firestore.rules', 'firestore.indexes.json']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Exercise forum at phone width
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({channel:'chrome'});
          try {
            const page = await browser.newPage({viewport:{width:390,height:844}});
            await page.route('https://www.gstatic.com/**', route => route.abort());
            await page.goto(pathToFileURL(process.cwd() + '/forum/index.html').href + '?demo=1');
            await page.getByText('Песня о северном сиянии', {exact:true}).waitFor();
            assert.equal(await page.locator('.topic').count(),4);
            await page.getByRole('searchbox').fill('дуэта');
            assert.equal(await page.locator('.topic').count(),1);
            await page.getByRole('searchbox').clear();
            await page.getByRole('button',{name:'Идеи для песен'}).click();
            await page.getByRole('link',{name:'Песня о северном сиянии'}).click();
            await page.getByRole('heading',{name:'Песня о северном сиянии'}).waitFor();
            await page.locator('#reply-form textarea').fill('Хорошая идея для песни!');
            await page.getByRole('button',{name:'Ответить'}).click();
            await page.getByText('Хорошая идея для песни!').waitFor();
            await page.getByRole('button',{name:'Изменить', exact:true}).click();
            await page.locator('#edit-form textarea').fill('Исправленный ответ.');
            await page.getByRole('button',{name:'Сохранить изменения'}).click();
            await page.getByText('Исправленный ответ.').waitFor();
            await page.getByRole('button',{name:/Создать тему/}).click();
            await page.getByLabel('Имя на форуме').fill('Tester');
            await page.locator('#topic-form input[name="title"]').fill('Новая музыкальная идея');
            await page.locator('#topic-form textarea[name="body"]').fill('Обсудим будущий релиз.');
            await page.getByRole('button',{name:'Опубликовать'}).click();
            await page.getByRole('heading',{name:'Новая музыкальная идея'}).waitFor();
            await page.getByRole('button',{name:'Изменить сообщение'}).click();
            await page.locator('#edit-form input[name="title"]').fill('Уточнённая музыкальная идея');
            await page.locator('#edit-form textarea').fill('Исправленное описание будущего релиза.');
            await page.getByRole('button',{name:'Сохранить изменения'}).click();
            await page.getByRole('heading',{name:'Уточнённая музыкальная идея'}).waitFor();
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth > innerWidth),false);
            // Landscape phones: logo stays on top; home + sign-out share row 1,
            // and "Create topic" starts a second row, without changing dialogs.
            await page.evaluate(() => {document.getElementById('sign-out').hidden = false;});
            for (const width of [667, 896]) {
              await page.setViewportSize({width, height:375});
              const layout = await page.evaluate(() => {
                const rect = selector => document.querySelector(selector).getBoundingClientRect();
                const brand = rect('.masthead .brand');
                const home = rect('.masthead .actions > a');
                const exit = rect('#sign-out');
                const create = rect('#new-topic');
                return {
                  hasLandscape:matchMedia('(orientation:landscape) and (max-width:980px)').matches,
                  brandAbove:brand.bottom <= home.top + 1,
                  buttonsInRow:Math.abs(home.top - exit.top) <= 2 && home.right < exit.left,
                  createBelow:create.top >= Math.max(home.bottom, exit.bottom),
                  noOverflow:document.documentElement.scrollWidth <= innerWidth,
                  dialogActionsRemainFlex:getComputedStyle(document.querySelector('#topic-dialog .actions')).display === 'flex'
                };
              });
              assert.deepEqual(layout, {hasLandscape:true,brandAbove:true,buttonsInRow:true,createBelow:true,noOverflow:true,dialogActionsRemainFlex:true});
            }
            await page.setViewportSize({width:390,height:844});
            assert.equal(await page.evaluate(() => getComputedStyle(document.querySelector('.masthead > .actions')).display), 'flex');
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth > innerWidth),false);
            console.log('Mobile portrait and landscape preview passed.');
          } finally {
            await browser.close();
          }
          NODE
