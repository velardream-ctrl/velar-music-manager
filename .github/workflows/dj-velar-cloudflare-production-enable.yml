name: Enable and verify DJ Velar production AI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dj-velar-cloudflare-production-enable.yml'

permissions:
  contents: read

concurrency:
  group: dj-velar-production
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable production and verify one model response
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          disabled=cloudflare/wrangler.production.toml
          enabled=cloudflare/.wrangler.production-enabled.toml
          grep -Fx 'PUBLIC_AI_ENABLED = "false"' "$disabled"
          sed 's/^PUBLIC_AI_ENABLED = "false"$/PUBLIC_AI_ENABLED = "true"/' "$disabled" > "$enabled"
          armed=0
          cleanup() {
            result=$?
            rm -f "$enabled"
            if [ "$result" -ne 0 ] && [ "$armed" -eq 1 ]; then
              echo 'Verification failed. Restoring the disabled public route.'
              npx --yes wrangler@4.164.0 deploy --config "$disabled" || echo '::error::Automatic disable failed; disable public AI in Cloudflare.'
            fi
            exit "$result"
          }
          trap cleanup EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://dj-velar-private-lab.velardream.workers.dev/health', {
            redirect: 'error',
            signal: AbortSignal.timeout(10000)
          });
          assert.equal(response.ok, true);
          const health = await response.json();
          assert.equal(health.status, 'hybrid-gateway');
          assert.equal(health.ready, true);
          assert.equal(health.publicEnabled, false);
          NODE
          armed=1
          npx --yes wrangler@4.164.0 deploy --config "$enabled"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://dj-velar-private-lab.velardream.workers.dev';
          let healthy = false;
          for (let i = 0; i < 12; i++) {
            const response = await fetch(base + '/health', { signal: AbortSignal.timeout(10000) });
            if (response.ok) {
              const health = await response.json();
              if (health.ready === true && health.publicEnabled === true) {
                healthy = true;
                break;
              }
            }
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          assert.equal(healthy, true, 'Production bindings did not become ready.');
          const origin = 'https://velardream.com';
          const response = await fetch(base + '/v1/public-chat', {
            method: 'POST',
            headers: { Origin: origin, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'What is a bass line in music?', language: 'en' }),
            redirect: 'error',
            signal: AbortSignal.timeout(20000)
          });
          assert.equal(response.status, 200, 'Production model request failed.');
          assert.equal(response.headers.get('access-control-allow-origin'), origin);
          const data = await response.json();
          assert.equal(data.kind, 'model_text_only');
          assert.ok(typeof data.reply === 'string' && data.reply.trim());
          console.log('Public Worker served a model reply with the production gates enabled.');
          NODE
