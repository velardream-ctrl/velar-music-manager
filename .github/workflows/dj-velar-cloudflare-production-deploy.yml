name: Deploy DJ Velar production gateway with public AI disabled
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dj-velar-cloudflare-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dj-velar-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify active version and deploy disabled gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!account || !/^[a-f0-9]{32}$/i.test(account) || !token || /[^A-Za-z0-9_-]/.test(token))
            throw new Error('Cloudflare credentials are missing or invalid.');
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account +
            '/workers/scripts/dj-velar-private-lab/deployments', {
            headers: { Authorization: 'Bearer ' + token }, redirect: 'error'
          });
          if (!response.ok) throw new Error('Cloudflare deployment lookup HTTP ' + response.status);
          const data = await response.json();
          const live = data.result?.deployments?.[0]?.versions;
          if (!data.success || live?.length !== 1 || live[0].percentage !== 100 ||
              live[0].version_id !== '8246ffc9-2209-4633-ab6b-10030b2764dc')
            throw new Error('Active production version changed. Review recovery source before deploy.');
          NODE
          npx --yes wrangler@4.164.0 deploy --config cloudflare/wrangler.production.toml
      - name: Verify live production gates
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://dj-velar-private-lab.velardream.workers.dev';
          let health;
          for (let i = 0; i < 10; i++) {
            const result = await fetch(base + '/health', { signal: AbortSignal.timeout(10000) });
            if (result.ok) health = await result.json();
            if (health?.status === 'hybrid-gateway') break;
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          assert.equal(health?.status, 'hybrid-gateway');
          assert.equal(health?.ready, true);
          assert.equal(health?.publicEnabled, false);
          const headers = { Origin: 'https://velardream.com', 'Content-Type': 'application/json' };
          for (const [path, method, status, code] of [
            ['/v1/public-chat', 'POST', 503, 'public_ai_disabled'],
            ['/v1/owner-test', 'POST', 401, 'unauthorized'],
            ['/v1/owner-stats', 'GET', 401, 'unauthorized']
          ]) {
            const response = await fetch(base + path, { method, headers, signal: AbortSignal.timeout(10000) });
            assert.equal(response.status, status);
            assert.equal((await response.json()).error, code);
          }
          console.log('Production readiness, disabled public route and closed owner endpoints verified.');
          NODE
