name: Smart song navigation browser tests
on:
  push:
    branches: [main]
    paths: ['smart-navigation.js', 'public-song-ui.js', 'tests/test-smart-navigation-browser.mjs']
  pull_request:
    paths:
      - 'public-song-ui.js'
      - 'smart-navigation.js'
      - 'tests/test-smart-navigation-browser.mjs'
      - '.github/workflows/smart-navigation-check.yml'
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: ''
          - os: macos-latest
            flags: '--webkit'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - if: runner.os == 'macOS'
        run: npx playwright install webkit
      - run: node tests/test-smart-navigation-browser.mjs ${{ matrix.flags }}
  published:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node tests/test-smart-navigation-browser.mjs --published
