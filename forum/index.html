<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#071020">
  <title>Созвездия — форум VELARDREAM</title>
  <link rel="stylesheet" href="forum.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="../"><img src="../assets/velardream-crystal.png" alt="" width="36" height="44">VELARDREAM <small>RECORDS</small></a>
    <div class="actions">
      <button id="sign-in" class="outline">Войти по email</button>
      <button id="sign-out" hidden>Выйти</button>
      <button id="new-topic" class="gold">＋ Создать тему</button>
    </div>
  </header>
  <main>
    <section class="sky" aria-labelledby="forum-title">
      <p class="eyebrow">Музыкальное сообщество</p>
      <h1 id="forum-title">Созвездия</h1>
      <nav id="constellations" class="constellations" aria-label="Разделы форума"></nav>
    </section>
    <div class="workspace">
      <p id="demo-note" class="note" hidden>Предпросмотр. Здесь используются примеры тем, письма не отправляются.</p>
      <p id="status" role="status" class="note"></p>
      <section id="board" class="panel" aria-labelledby="board-title">
        <div class="panel-head">
          <h2 id="board-title">Свежие обсуждения</h2>
          <label class="search"><span class="sr-only">Поиск по темам</span><input id="search" type="search" placeholder="Поиск по темам"></label>
        </div>
        <div id="topics"></div>
      </section>
      <section id="thread" class="panel" hidden aria-labelledby="thread-title">
        <a href="./" id="back">← Все обсуждения</a>
        <h2 id="thread-title"></h2>
        <p id="thread-meta" class="muted"></p>
        <p id="thread-body" class="message"></p>
        <h3>Ответы</h3>
        <div id="replies"></div>
        <form id="reply-form">
          <label>Ваш ответ<textarea name="body" maxlength="2000" required></textarea></label>
          <button class="gold" type="submit">Ответить</button>
        </form>
      </section>
    </div>
  </main>
  <dialog id="email-dialog">
    <form id="email-form">
      <h2 id="email-title">Войти по email</h2>
      <p id="email-help">Пришлём ссылку для входа. Адрес email не отображается в обсуждениях.</p>
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <p id="email-status" role="status"></p>
      <div class="actions"><button type="button" data-close>Закрыть</button><button type="submit" class="gold" id="email-submit">Отправить ссылку</button></div>
    </form>
  </dialog>
  <dialog id="topic-dialog">
    <form id="topic-form">
      <h2>Новая тема</h2>
      <label>Имя на форуме<input name="author" minlength="2" maxlength="32" required></label>
      <label>Раздел<select name="category" required></select></label>
      <label>Заголовок<input name="title" minlength="3" maxlength="100" required></label>
      <label>Сообщение<textarea name="body" minlength="3" maxlength="3000" required></textarea></label>
      <p id="similar" class="muted"></p>
      <p id="topic-status" role="status"></p>
      <div class="actions"><button type="button" data-close>Закрыть</button><button type="submit" class="gold">Опубликовать</button></div>
    </form>
  </dialog>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script defer src="../studio/firebase-config.js"></script>
  <script defer src="forum.js"></script>
</body>
</html>
